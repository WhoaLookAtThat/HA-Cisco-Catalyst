name: Tests

on:
  push:
    branches:
      - main
      - feature/initial-snmpv2-integration
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Compile integration
        run: python -m compileall -q custom_components/cisco_catalyst

      - name: Check for Python correctness issues
        run: ruff check --select E9,F63,F7,F82 custom_components tests

      - name: Run tests
        run: python -m pytest -q
