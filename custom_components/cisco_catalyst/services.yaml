review_vlan_proposal:
  name: Review VLAN proposal
  description: Read-only evaluation of an existing access VLAN assignment proposal. Does not change the switch.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Exact Cisco Catalyst integration configuration entry ID.
      required: true
      example: "01EXAMPLEENTRY"
      selector:
        text:
    if_index:
      name: SNMP interface index
      description: Actual observed ifIndex, not the physical port number.
      required: true
      example: 44
      selector:
        number:
          min: 1
          mode: box
    target_vlan:
      name: Proposed destination VLAN
      description: An existing operational Ethernet access VLAN.
      required: true
      example: 20
      selector:
        number:
          min: 1
          max: 4094
          mode: box
    expected_interface_name:
      name: Expected physical interface name
      description: Full observed Cisco interface name; reviewed against switch data.
      required: true
      example: GigabitEthernet1/0/37
      selector:
        text:
    confirmation_preference:
      name: Confirmation advice
      description: Graduated warning preference for this read-only review.
      required: false
      default: balanced
      selector:
        select:
          options:
            - minimal
            - balanced
            - cautious

confirm_vlan_change:
  name: Confirm access VLAN change
  description: Changes a static access VLAN only after explicit acknowledgment and final switch-side revalidation. May interrupt connectivity.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Exact Cisco Catalyst integration configuration entry ID.
      required: true
      example: "01EXAMPLEENTRY"
      selector:
        text:
    if_index:
      name: SNMP interface index
      description: Actual observed ifIndex; never infer from the physical port number.
      required: true
      example: 44
      selector:
        number:
          min: 1
          mode: box
    expected_interface_name:
      name: Expected physical interface name
      description: Full observed Cisco interface name, checked before SET.
      required: true
      example: GigabitEthernet1/0/37
      selector:
        text:
    expected_current_vlan:
      name: Expected current VLAN
      description: Current access VLAN observed during review.
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 4094
          mode: box
    target_vlan:
      name: Destination VLAN
      description: Existing operational access VLAN to assign.
      required: true
      example: 20
      selector:
        number:
          min: 1
          max: 4094
          mode: box
    acknowledged:
      name: Acknowledge disruption risk
      description: Must be true to execute. Changing the VLAN may interrupt attached devices and management.
      required: true
      selector:
        boolean:

create_vlan:
  name: Create VLAN
  description: Create a normal-range VLAN on the switch via SNMP. Does not reassign any ports.
  fields:
    entry_id:
      name: Configuration entry ID
      required: true
      selector:
        text:
    vlan_id:
      name: VLAN ID
      required: true
      selector:
        number:
          min: 2
          max: 1001
          mode: box
    name:
      name: VLAN name
      required: true
      selector:
        text:
